# Lupa configuration. On first run this file is copied to `lupa.toml` (your personal, git-ignored copy).
# Paths may start with "~". Restart Lupa (⌘Q, open again) after editing.

# Folders to index. Add network drives too, e.g. "/Volumes/NAS".
roots = ["~"]

# Folder shortcuts shown under „Gdzie” (Where) in the sidebar.
places = [
  { name = "Pobrane", path = "~/Downloads", icon = "⬇️" },
  { name = "Biurko", path = "~/Desktop", icon = "🖥️" },
  { name = "Dokumenty", path = "~/Documents", icon = "📄" },
  { name = "Obrazy", path = "~/Pictures", icon = "🖼️" },
  { name = "iCloud Drive", path = "~/Library/Mobile Documents/com~apple~CloudDocs", icon = "☁️" },
]

# Full scan of network drives (NAS) at most every N hours — it is slow, so not on every start.
network_rescan_hours = 168        # pełny skan NAS raz w tygodniu (Mac: indeksowanie na żywo)

# Content analysis (GPU) only on mains power; pauses on battery.
pause_on_battery = true

# Na zasilaniu z sieci indeksator pracuje szybciej (bez trybu tła macOS). / Faster on mains power.
fast_on_ac = true

# Typy plików na dyskach sieciowych analizowane tylko po nazwie (kod i HTML to zwykle kopie stron).
# File kinds on network drives indexed by name only (code/HTML there are mostly website exports).
name_only_on_network = ["code", "web", "font"]

# AI (lokalnie) / local AI
# Model Ollama do zakładki „Zapytaj”: gemma3:4b (lekki, 3,3 GB) albo gemma4 (8B, lepsze odpowiedzi, 9,6 GB RAM).
ask_model = "gemma3:4b"
live_index = true         # natychmiastowe indeksowanie zmian na dysku lokalnym (FSEvents)
ocr = true                 # OCR skanów i obrazów z tekstem (Apple Vision)
transcribe = true          # transkrypcja nagrań (Whisper, gdy indeksator nie pracuje)
transcribe_max_minutes = 20

# Local web UI port: http://localhost:7766
port = 7766

# Re-scan every N hours (0 = only manually).
reindex_every_hours = 3

# Image analysis detail (tokens per image): 70 = fastest, 140 = balanced, 280 = full quality (~2x slower than 140).
image_tokens = 140

# Vector size (768 / 512 / 256 / 128). 256 = good quality, 3x less space. Changing it requires deleting data/.
dim = 256

# Full paths skipped entirely (the Lupa project folder itself is always skipped).
exclude_paths = []

# Folder names skipped everywhere. (~/Library is always skipped except the include_paths below.)
exclude_dirs = [
  ".Trash", "node_modules", ".git", ".svn", ".hg", ".venv", "venv", "env",
  "__pycache__", ".next", ".nuxt", ".cache", ".npm", ".yarn", ".pnpm-store", "Pods",
  "DerivedData", ".gradle", ".idea", ".vscode", ".turbo", ".vercel", "site-packages",
  "#recycle", "#snapshot", "@eaDir", ".SynologyWorkingDirectory", ".Spotlight-V100",
  ".fseventsd", ".TemporaryItems", ".DocumentRevisions-V100", "$RECYCLE.BIN",
  # build output / app caches
  "dist", ".astro", ".output", ".svelte-kit", "Partitions", "Cache", "Cache_Data", "Code Cache",
  "GPUCache", "Service Worker", "IndexedDB", "Local Storage", "Session Storage", "blob_storage",
  "Crashpad", "logs",
]

# Indexed even though they live inside ~/Library.
include_paths = [
  "~/Library/Mobile Documents/com~apple~CloudDocs",
]

# macOS packages — treated as a single item (not entered).
package_exts = [
  ".app", ".photoslibrary", ".fcpbundle", ".logicx", ".band", ".xcodeproj", ".xcworkspace",
  ".bundle", ".framework", ".plugin", ".kext", ".lrdata", ".imovielibrary", ".tvlibrary",
  ".musiclibrary", ".rtfd", ".pages", ".numbers", ".key", ".sketch", ".scriv", ".dmgpart",
  ".eaglepack", ".library", ".prproj-bundle", ".aep-bundle", ".fcpxmld", ".screenstudio",
]

# Extensions skipped completely.
skip_exts = [
  ".pyc", ".pyo", ".o", ".a", ".so", ".dylib", ".class", ".tmp", ".lock", ".swp",
  ".ds_store", ".localized", ".icloud", ".part", ".crdownload", ".download",
]

# Porządki (disk cleanup tab) — local disk only, nothing is deleted without your click (items go to the Trash).
[cleanup]
every_days = 7            # automatic scan interval
low_space_percent = 15    # macOS notification when free space drops below this
big_file_mb = 200         # "big, long-unused files" threshold
old_days = 365            # …and how long they must be untouched
downloads_old_days = 90   # Downloads items not opened for this long
unused_app_days = 180     # apps not opened for this long
leftover_min_mb = 20      # ignore tiny leftovers of uninstalled apps
